[workspace]
resolver = "2"
members = [
  "crates/djengine",
  "crates/djlive",
  "crates/beatscript-api",
  "crates/beatscriptls",
  "crates/beatscript-seal",
  "crates/beatscript-serve",
  "crates/djweb",
  "crates/beatscript-cli",
  "crates/beatscript-round",
  "crates/djhost",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
# Code is MIT; BeatScript programs and all content (lexicon, phrasebooks, themes, ontology, fixtures, docs) are
# CC0-1.0. REUSE.toml says which is which, path by path.
license = "MIT"
publish = false
repository = "https://github.com/stackdump/beatscript"
homepage = "https://beatscript.app"

[workspace.dependencies]
# The public engine, stackdump/djrust, pinned by commit. Every crate here builds against exactly this revision;
# to move it, change both revs (they must be equal) and run `cargo update -p djrust -p djrust-wallet`.
djrust = { git = "https://github.com/stackdump/djrust", rev = "2aeffaff9f322d053e9525683a6f398874dd881d", default-features = false }
djrust-wallet = { git = "https://github.com/stackdump/djrust", rev = "2aeffaff9f322d053e9525683a6f398874dd881d" }
# The Wheel (a linear tonewheel), public stackdump/windwheel-bitwrap-io: djhost's off-by-default `windwheel` feature
# (the booth) and the browser module (djweb src/wheel.rs, so the page plays `wheel` lines as the booth does) pull it in.
# No other default build has it (scripts/check-public-build.sh).
windwheel = { git = "https://github.com/stackdump/windwheel-bitwrap-io", rev = "9e396405794e8c218b8618ea887cbfde8cc70ba4", default-features = false }
djengine = { path = "crates/djengine" }
djhost = { path = "crates/djhost" }
djlive = { path = "crates/djlive" }

# The parity suites compose ~550 projects; unoptimised that takes over a minute.
[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
