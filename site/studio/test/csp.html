<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- what a Claude artifact page allows, plus 'wasm-unsafe-eval', without which no WebAssembly runs: scripts inline, from
     this page's own files or a CDN; fetches to this page's origin only; nothing else (the same CSP as the player's page) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' cdn.jsdelivr.net unpkg.com; connect-src 'self'">
<title>beatscript-studio under an artifact CSP</title>
<script>
  // every blocked request or script, for the test (and for a person: the count is printed below)
  window.__violations = [];
  document.addEventListener('securitypolicyviolation', function (e) {
    window.__violations.push({ directive: e.violatedDirective, blocked: e.blockedURI, sample: e.sample });
    var n = document.getElementById('violations');
    if (n) n.textContent = window.__violations.length + ' blocked: ' + window.__violations.map(function (v) { return v.directive + ' ' + v.blocked; }).join(', ');
  });
</script>
<script type="module" src="../beatscript-studio.js"></script>
</head>
<body>
<h1>beatscript-studio</h1>
<p>The editor, its checker and the bundled engine. Edit the program, press Play (or Ctrl+Enter).</p>
<beatscript-studio id="studio">
  <script type="text/beatscript">
#! name: artifact test: drums and a melody
tempo 120
key am
let four = x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ x ~ ~ ~
let backs = ~ ~ ~ ~ x ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~
section verse 4 bars {
  deck A: kick four kit=drums-808 | snare backs
  deck B: melody a4 ~ c5 ~ e5 ~ c5 ~ a4 ~ g4 ~ a4 ~ ~ ~
}
arrange verse
  </script>
</beatscript-studio>

<h2>With features and capabilities</h2>
<p>Render mode, every feature, every capability: outside an artifact the capabilities are not there, and the notes say so.</p>
<beatscript-studio id="full" theme="light" compact>
  <script type="application/json" class="beatscript-config">
{"audio": "render", "features": ["highlight", "editor", "mixer", "download", "share", "compose"], "capabilities": ["sample", "mcp", "db", "downloads", "room"]}
  </script>
  <script type="text/beatscript">
#! name: a light one
tempo 100
deck A: kick x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ | hihat ~ ~ x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ x ~
  </script>
</beatscript-studio>
<p id="violations">0 blocked</p>
</body>
</html>
