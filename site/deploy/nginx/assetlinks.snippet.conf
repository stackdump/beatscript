# Android App Links verification (installed as /etc/nginx/snippets/beatscript-assetlinks.conf, `include`d by the 443
# server block of every host the app claims: beatscript.app, btw.bitwrap.io, beats.bitwrap.io).
# The verifier does NOT follow redirects and wants 200 + application/json from the host itself, so this exact-match
# location (it outranks any regex or `location /` redirect) proxies to beatscript-serve, which serves the statement
# embedded in the binary (crates/beatscript-serve/src/public/assetlinks.json: the one list of fingerprints).
# btw_front is the upstream in conf.d/btw-front.conf.
location = /.well-known/assetlinks.json {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://btw_front;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
