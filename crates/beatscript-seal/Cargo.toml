[package]
name = "beatscript-seal"
description = "Private pushes to a paired phone: a BeatScript program sealed for the phone's key (X25519 from its Ed25519 pairing key, HKDF-SHA256, ChaCha20-Poly1305). beatscript.app relays the sealed bytes in memory and cannot read them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# all MIT / Apache-2.0 / BSD-3-Clause (RustCrypto and dalek)
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
serde_json = "1"
