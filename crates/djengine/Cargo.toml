[package]
name = "djengine"
description = "The private engine modules (MCP, console, agent, import, techniques, render requests) on top of the public djrust crate. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Nothing in the engine needs std; the feature only exists so hosts get std's
# OnceLock-free fast path and error trait impls. `--no-default-features` is
# built in CI to keep it that way.
std = ["djrust/std"]
# A prepared track as bytes: djrust::transfer.
transfer = ["djrust/transfer"]

[dependencies]
djrust.workspace = true
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
once_cell = { version = "1", default-features = false, features = ["race", "alloc"] }
libm = "0.2"

[dev-dependencies]
# tests/mcp.rs checks a tool-list digest.
sha2 = { version = "0.10", default-features = false }
