[package]
name = "beatscript-cli"
description = "beatscript from a shell and for the beatscript.app server: check / fmt / open / share / highlight / cheatsheet / instruments / render (streaming PCM). No audio or MIDI features: builds on a bare Linux box."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "beatscript"
path = "src/main.rs"

[dependencies]
# with the Wheel (its `wheel` feature): a render plays `wheel` lines on the very voice the page plays them on (src/browser.rs)
beatscript-api = { path = "../beatscript-api", features = ["wheel"] }
beatscriptls = { path = "../beatscriptls" }
djengine.workspace = true
djhost.workspace = true
djlive.workspace = true
