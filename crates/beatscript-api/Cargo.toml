[package]
name = "beatscript-api"
description = "beatscript as JSON: check / fmt / open / share / highlight / marks over djlive, pure (no I/O, no clock), shared by the beatscript-cli CLI and the djweb wasm module so they cannot disagree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The Wheel as the page plays it (src/wheel.rs): windwheel's tonewheel and the voice around it. On in the browser module
# (djweb) and in `beatscript render` (beatscript-cli, and beatscript-serve, which links its render), so both play one Wheel;
# off everywhere else (scripts/check-public-build.sh).
wheel = ["dep:windwheel", "dep:anyhow"]

[dependencies]
djengine.workspace = true
djlive.workspace = true
windwheel = { workspace = true, optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
# The snapshot generator and its drift test read the real registry and catalog (djhost is not wasm-friendly,
# so it is never a dependency of the crate itself).
djhost.workspace = true
# tests/api.rs packs a link by hand the way djlive::share does, to open one whose program no longer checks.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
