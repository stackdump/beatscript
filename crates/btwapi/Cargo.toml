[package]
name = "btwapi"
description = "btw as JSON: check / fmt / open / share / highlight / marks over djlive, pure (no I/O, no clock), shared by the btwd CLI and the djweb wasm module so they cannot disagree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
djengine.workspace = true
djlive.workspace = true

[dev-dependencies]
# The snapshot generator and its drift test read the real registry and catalog (djhost is not wasm-friendly,
# so it is never a dependency of the crate itself).
djhost.workspace = true
# tests/api.rs packs a link by hand the way djlive::share does, to open one whose program no longer checks.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
